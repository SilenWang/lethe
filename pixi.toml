[workspace]
name = "lethe"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
nodejs = "22.*"

[pypi-dependencies]
lethe = { path = ".", editable = true }
pytest = ">=8.2"
ruff = ">=0.6"
mypy = ">=1.11"
playwright = ">=1.47"
pillow = ">=10"
lxml = ">=6.0"

[tasks]
# ---- P0 gates: every command below is what the five CI jobs run -------------
lint = "ruff check lethe/core.py lethe/docx_engine.py lethe/gates.py lethe/postprocess.py lethe/pptx_engine.py lethe/xlsx_engine.py lethe/web_entry.py tools/build_web.py tools/build_dictionary.py tools/fidelity_regression.py tools/measure_50mb.py tools/guard_no_bare_save.py tools/postprocess_contract.py tools/verify_corpus.py tools/make_corpus.py tools/vendor_assets.py tools/asset_version_guard.py tools/guard_fixtures tests/test_core_preset_rules.py tests/test_docx_engine.py tests/test_dictionary_distribution.py tests/test_fidelity_regression.py tests/test_pptx_engine.py tests/test_xlsx_engine.py tests/test_gates.py tests/test_guard_no_bare_save.py tests/test_postprocess.py tests/test_postprocess_contract.py tests/test_worker_eager_policy.py tests/browser/test_p0_offline_assets.py tests/browser/_server.py tests/browser/test_p1_build.py tests/browser/test_p1_worker.py tests/browser/test_p1_dod.py tests/browser/test_client_store_v3.py tests/browser/test_p1_ui.py tests/browser/test_p2_pptx.py tests/browser/test_p2_xlsx.py tests/browser/test_p3_dictionary.py tests/browser/test_p3_user_dictionary.py"
typecheck = "mypy --follow-imports=silent --ignore-missing-imports lethe/core.py lethe/docx_engine.py lethe/gates.py lethe/postprocess.py lethe/pptx_engine.py lethe/xlsx_engine.py lethe/web_entry.py tools/build_web.py tools/build_dictionary.py tools/fidelity_regression.py tools/measure_50mb.py tools/postprocess_contract.py tools/verify_corpus.py tools/guard_no_bare_save.py tools/asset_version_guard.py"
unit = "python -m pytest tests -q --ignore=tests/browser"
browser = "python -m pytest tests/browser/test_p0_offline_assets.py tests/browser/test_p1_build.py tests/browser/test_p1_worker.py tests/browser/test_client_store_v3.py tests/browser/test_p1_dod.py tests/browser/test_p2_pptx.py tests/browser/test_p2_xlsx.py tests/browser/test_p3_dictionary.py tests/browser/test_p3_user_dictionary.py -q && python -m pytest tests/browser/test_p1_ui.py -q"
e2e = "python -m pytest tests/browser/test_p1_build.py tests/browser/test_p1_worker.py tests/browser/test_client_store_v3.py tests/browser/test_p1_dod.py tests/browser/test_p2_pptx.py tests/browser/test_p2_xlsx.py -q && python -m pytest tests/browser/test_p1_ui.py -q"
web-check = "python tools/build_web.py --check-only"
web-build = "python tools/build_web.py"
web-serve = "python -m http.server 8080 --bind 127.0.0.1 --directory dist/web"
dictionary-build = "python tools/build_dictionary.py --signing-key $LETHE_DICTIONARY_SIGNING_KEY"
dictionary-check = "python tools/build_dictionary.py --verify-only"
guard = "python -m pytest tests/test_guard_no_bare_save.py -q && python tools/guard_no_bare_save.py --paths lethe web"
fidelity-render-image = "docker build -f tools/fidelity-render.Dockerfile -t lethe-fidelity-render tools"
fidelity-corpus = "docker build -f tools/fidelity-render.Dockerfile -t lethe-fidelity-render tools && python tools/verify_corpus.py --strict && python tools/vendor_assets.py --verify-only && python tools/asset_version_guard.py && LETHE_FIDELITY_DOCKER_IMAGE=lethe-fidelity-render python tools/fidelity_regression.py"
measure-50mb = "python tools/measure_50mb.py"
gates = "python -m pytest tests/test_gates.py -q"
contract = "python -m pytest tests/test_postprocess_contract.py -q"
corpus = "python tools/make_corpus.py"
assets-fetch = "python tools/vendor_assets.py --fetch"
assets-verify = "python tools/vendor_assets.py --verify-only"
p0 = { depends-on = ["lint", "typecheck", "unit", "gates", "guard", "contract", "fidelity-corpus"] }
