[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe"
version = "1.3.1"
description = "Lethe — a local, reversible document de-identifier"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Meng Huey" }]
keywords = ["pii", "de-identification", "redaction", "privacy", "nicegui", "presidio"]

# Base engine + UI. The NLP suggestion engine is an optional extra (see below);
# without it, Lethe falls back to a built-in regex name-guesser.
dependencies = [
    "nicegui",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "pypdf",
    "pdfplumber",
    "cryptography",
]

[project.optional-dependencies]
# Microsoft Presidio + spaCy + the small English model. Needs Python <= 3.13
# (spaCy has no 3.14 wheels yet). Install with:  pipx install "lethe[nlp] @ git+..."
# Bigger name-detection models (md/lg/trf, Chinese/Japanese/Korean) are NOT here:
# the app's Settings page downloads and switches between them on demand, so the
# default install stays small. English and Chinese default to the lg models
# (used automatically once installed); pre-install them with [nlp-models].
nlp = [
    "presidio-analyzer",
    "presidio-anonymizer",
    "spacy",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# The larger name-detection models, pre-installed (opt-in: ~2.8 GB in total).
# Same wheels the Settings page downloads on demand; a plain `lethe[nlp]`
# install works the same as before, these just save the one-off downloads and
# make English/Chinese detection use lg out of the box (their default).
nlp-models = [
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "zh_core_web_md @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_md-3.8.0/zh_core_web_md-3.8.0-py3-none-any.whl",
    "zh_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_lg-3.8.0/zh_core_web_lg-3.8.0-py3-none-any.whl",
    "ja_core_news_md @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_md-3.8.0/ja_core_news_md-3.8.0-py3-none-any.whl",
    "ja_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_lg-3.8.0/ja_core_news_lg-3.8.0-py3-none-any.whl",
    "ko_core_news_md @ https://github.com/explosion/spacy-models/releases/download/ko_core_news_md-3.8.0/ko_core_news_md-3.8.0-py3-none-any.whl",
    "ko_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/ko_core_news_lg-3.8.0/ko_core_news_lg-3.8.0-py3-none-any.whl",
]
# Fully-local OCR for scanned / image-based PDF pages (PDFium + bundled
# Tesseract, ~16 MB). Without it those pages are flagged but not read.
ocr = [
    "liteparse",
]
# Read Outlook .msg files. .eml and .html need no extra (Python stdlib); .msg is
# an OLE compound format, so it needs extract-msg (~18 MB with its dependency
# tree). Without this extra, .eml/.html still work and .msg is flagged. The
# Windows installer / portable bundle ship it so .msg works out of the box.
email = [
    "extract-msg",
]
# Test runner. The suite under tests/ also runs as plain scripts, but pytest
# discovers the function-based tests (e.g. tests/test_core.py): pytest tests/
dev = [
    "pytest",
]

[project.scripts]
lethe = "app:run_app"

[project.urls]
Homepage = "https://github.com/moonlight-lupin/lethe"
Repository = "https://github.com/moonlight-lupin/lethe"

[tool.setuptools]
# app.py is the UI (a top-level module); the engine + assets live in the package.
py-modules = ["app"]
packages = ["lethe"]
include-package-data = true

[tool.setuptools.package-data]
lethe = ["web_static/*", "web_static/fonts/*"]
