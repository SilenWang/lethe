[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe"
version = "1.3.1"
description = "Lethe — a fully local PWA for reversible document de-identification"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Meng Huey" }]
keywords = ["pii", "de-identification", "redaction", "privacy", "pwa"]

dependencies = [
    "cryptography",
    "lxml>=6.0",
]

[project.optional-dependencies]
# Test runner. The suite under tests/ also runs as plain scripts, but pytest
# discovers the function-based tests (e.g. tests/test_core.py): pytest tests/
dev = [
    "openpyxl",
    "pillow",
    "playwright",
    "python-docx",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/moonlight-lupin/lethe"
Repository = "https://github.com/moonlight-lupin/lethe"

[tool.setuptools]
# The deterministic core, legacy compatibility helpers and static web sources.
packages = ["lethe"]
include-package-data = true

[tool.setuptools.package-data]
lethe = ["web_static/*", "web_static/fonts/*", "web_static/icons/*", "locales/*.json"]
