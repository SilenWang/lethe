name: Release (static PWA)

# Builds the same-origin static artifact on a version tag and creates a draft
# GitHub Release containing the directory as a zip plus its SHA-256 digest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

env:
  PIXI_VERSION: "0.76.1"

jobs:
  static-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true

      - name: Build and verify static artifact
        run: |
          pixi run release-check
          pixi run web-build

      - name: Package static site
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ -z "$ref" ] || [ "$ref" = "workflow_dispatch" ]; then
            ref="${{ github.event.inputs.tag }}"
          fi
          version="${ref#v}"
          mkdir -p release
          zip -qr "release/lethe-${version}-web.zip" dist/web
          sha256sum "release/lethe-${version}-web.zip" > "release/lethe-${version}-web.zip.sha256"
          printf 'tag=%s\nversion=%s\n' "$ref" "$version" >> "$GITHUB_OUTPUT"
        id: stage

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.stage.outputs.tag }}" \
            release/lethe-${{ steps.stage.outputs.version }}-web.zip \
            release/lethe-${{ steps.stage.outputs.version }}-web.zip.sha256 \
            --draft \
            --generate-notes \
            --title "Lethe ${{ steps.stage.outputs.tag }}"
