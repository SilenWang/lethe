name: CI (dual track)

# v1 keeps living on main/dev; v2 development happens on next/rewrite.
# Every PR whose base is next/rewrite runs these five jobs; the branch is
# expected to require all five before merge.
#
# P0 status: all five jobs are wired for next/rewrite and passed on the P0 PR
# (github.com/SilenWang/lethe/pull/13). Run any of them locally with
# `pixi run <task>`.

on:
  push:
    branches: [main, dev, next/rewrite]
  pull_request:
    branches: [main, dev, next/rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_VERSION: "0.76.1"

jobs:
  lint-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: ruff
        run: pixi run lint
      - name: mypy
        run: pixi run typecheck
      - name: signed dictionary pack
        run: pixi run dictionary-check

  unit:
    name: unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: pytest
        env:
          LETHE_DATA_DIR: ${{ runner.temp }}/lethe-ci
        run: pixi run unit

  browser:
    name: browser (Playwright, offline assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: install Chromium
        run: pixi run python -m playwright install --with-deps chromium
      - name: offline asset load + sha256
        run: pixi run browser

  fidelity-corpus:
    name: fidelity corpus (90 files + asset lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: corpus coverage + sha256 + pinned asset versions
        run: pixi run fidelity-corpus

  guard:
    name: guard (no bare save/toBytes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: guard tests (includes deliberate violations)
        run: pixi run guard
