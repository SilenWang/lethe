name: CI (dual track)

# v1 keeps living on main/dev; v2 development happens on next/rewrite.
# Every PR whose base is next/rewrite runs these five jobs; the branch is
# expected to require all five before merge.
#
# P0 status: the five jobs are runnable locally with `pixi run <task>` and are
# wired here for next/rewrite. They have NOT been triggered on GitHub yet —
# the runtime that produced P0 has no push credentials (see docs/p0/handoff.md).

on:
  push:
    branches: [main, dev, next/rewrite]
  pull_request:
    branches: [main, dev, next/rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_VERSION: "0.76.1"
  LETHE_DATA_DIR: ${{ runner.temp }}/lethe-ci

jobs:
  lint-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: ruff
        run: pixi run lint
      - name: mypy
        run: pixi run typecheck

  unit:
    name: unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: pytest
        run: pixi run unit

  browser:
    name: browser (Playwright, offline assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: install Chromium
        run: pixi run python -m playwright install --with-deps chromium
      - name: offline asset load + sha256
        run: pixi run browser

  fidelity-corpus:
    name: fidelity corpus (90 files + asset lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: corpus coverage + sha256 + pinned asset versions
        run: pixi run fidelity-corpus

  guard:
    name: guard (no bare save/toBytes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          run-install: true
      - name: guard tests (includes deliberate violations)
        run: pixi run guard
