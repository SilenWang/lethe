<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6a4690" />
    <meta
      name="description"
      content="Local, reversible document de-identification. Documents are processed in this browser and never uploaded."
    />
    <title>Lethe — Document De-identifier</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./ui/favicon.svg" />
    <link rel="stylesheet" href="./ui/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Lethe</h1>
        <p class="tagline" data-i18n="p1.tagline"></p>
      </div>
      <div class="topbar-actions">
        <span id="runtime-badge" class="badge badge-wait" data-i18n="p1.runtime.initializing"></span>
        <label class="lang-picker">
          <span data-i18n="p1.lang"></span>
          <select id="lang-select" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <button id="install-btn" type="button" class="btn btn-ghost" hidden data-i18n="p1.install"></button>
      </div>
    </header>

    <div id="preload-panel" class="preload" hidden>
      <progress id="preload-bar" max="100" value="0"></progress>
      <span id="preload-text"></span>
      <button id="preload-retry" type="button" class="btn btn-ghost" hidden data-i18n="p1.preload.retry"></button>
      <button id="runtime-retry" type="button" class="btn btn-ghost" hidden data-i18n="p1.runtime.retry"></button>
    </div>

    <nav class="steps" role="tablist" aria-label="Workflow">
      <button id="tab-deidentify" role="tab" type="button" data-panel="deidentify" aria-selected="true"
              aria-controls="panel-deidentify" class="step is-active">
        <span data-i18n="p1.page.deidentify"></span>
      </button>
      <button id="tab-reidentify" role="tab" type="button" data-panel="reidentify" aria-selected="false"
              aria-controls="panel-reidentify" class="step">
        <span data-i18n="p1.page.reidentify"></span>
      </button>
      <button id="tab-dictionary" role="tab" type="button" data-panel="dictionary" aria-selected="false"
              aria-controls="panel-dictionary" class="step">
        <span data-i18n="p1.page.dictionary"></span>
      </button>
    </nav>

    <main>
      <section id="panel-deidentify" class="panel" role="tabpanel"
               aria-labelledby="tab-deidentify">
        <h2 data-i18n="p1.upload.title"></h2>
        <p class="hint" data-i18n="p1.upload.hint"></p>
        <div id="upload-drop" class="dropzone" tabindex="0" role="button">
          <p data-i18n="p1.upload.drop"></p>
          <p class="hint" data-i18n="p1.upload.formats"></p>
        </div>
        <input id="upload-input" type="file" accept=".docx,.xlsx,.pptx" hidden />
        <p id="upload-file" class="file-line" hidden></p>
        <p id="upload-note" class="note" hidden></p>
        <details id="upload-degradations" class="note" hidden>
          <summary data-i18n="p1.degradations.title"></summary>
          <ul id="degradation-list"></ul>
        </details>
        <p id="upload-inspect" class="meta" hidden></p>
        <p id="upload-warnings" class="note" hidden></p>
        <div class="actions">
          <button id="inspect-btn" type="button" class="btn" disabled data-i18n="p1.upload.inspect"></button>
          <button id="detect-btn" type="button" class="btn btn-primary" disabled data-i18n="p1.upload.continue"></button>
          <button id="clear-btn" type="button" class="btn btn-ghost" disabled data-i18n="p1.upload.clear"></button>
        </div>

        <div class="manual-row">
          <label for="manual-entity" data-i18n="p1.manual.label"></label>
          <input id="manual-entity" type="text" data-i18n-placeholder="p1.manual.placeholder" />
          <select id="manual-type" aria-label="Type"></select>
          <button id="manual-add-btn" type="button" class="btn" disabled data-i18n="p1.manual.add"></button>
        </div>

        <div id="preview-card" class="card preview-card" hidden>
          <div class="section-head">
            <h3 data-i18n="p1.preview.title"></h3>
            <span id="preview-note" class="meta"></span>
          </div>
          <pre id="document-preview" tabindex="0"></pre>
        </div>

        <div id="review-card" class="card review-card" hidden>
          <h3 data-i18n="p1.review.title"></h3>
          <p class="hint" data-i18n="p1.review.hint"></p>
          <div class="review-tools">
            <span id="review-count" class="meta"></span>
            <button id="select-all-btn" type="button" class="btn btn-ghost" data-i18n="p1.review.check_all"></button>
            <button id="select-none-btn" type="button" class="btn btn-ghost" data-i18n="p1.review.uncheck_all"></button>
          </div>
          <div class="table-wrap">
            <table class="review-table">
              <thead>
                <tr>
                  <th scope="col"></th>
                  <th scope="col" data-i18n="p1.review.value"></th>
                  <th scope="col" data-i18n="p1.review.type"></th>
                  <th scope="col" data-i18n="p1.review.source"></th>
                  <th scope="col" data-i18n="p1.review.count"></th>
                  <th scope="col" data-i18n="p1.review.token"></th>
                </tr>
              </thead>
              <tbody id="review-rows"></tbody>
            </table>
          </div>
          <p id="review-empty" class="note" hidden data-i18n="p1.review.empty"></p>
          <div class="actions">
            <label class="check">
              <input id="save-names" type="checkbox" checked />
              <span data-i18n="p1.review.save_names"></span>
            </label>
            <button id="rescan-btn" type="button" class="btn btn-ghost" data-i18n="p1.review.rescan"></button>
            <button id="generate-btn" type="button" class="btn btn-primary" data-i18n="p1.review.generate"></button>
          </div>
        </div>

        <div id="generate-card" class="card" hidden>
          <h3 data-i18n="p1.generate.title"></h3>
          <p id="generate-summary" class="result-line"></p>
          <p id="generate-job" class="meta"></p>
          <p id="generate-saved" class="meta"></p>
          <div class="actions">
            <button id="download-btn" type="button" class="btn btn-primary" data-i18n="p1.generate.download"></button>
            <button id="goto-restore-btn" type="button" class="btn" data-i18n="p1.generate.to_restore"></button>
            <button id="restart-btn" type="button" class="btn btn-ghost" data-i18n="p1.generate.restart"></button>
          </div>
        </div>
      </section>

      <section id="panel-reidentify" class="panel" role="tabpanel"
               aria-labelledby="tab-reidentify" hidden>
        <h2 data-i18n="p1.restore.title"></h2>
        <p class="hint" data-i18n="p1.restore.hint"></p>

        <div class="section-head">
          <h3 data-i18n="p1.history.title"></h3>
          <button id="history-refresh" type="button" class="btn btn-ghost" data-i18n="p1.history.refresh"></button>
        </div>
        <p id="restore-no-jobs" class="note" hidden data-i18n="p1.restore.no_jobs"></p>
        <div class="table-wrap">
          <table class="review-table history-table">
            <thead>
              <tr>
                <th scope="col"></th>
                <th scope="col" data-i18n="p1.history.when"></th>
                <th scope="col" data-i18n="p1.history.files"></th>
                <th scope="col" data-i18n="p1.history.replacements"></th>
                <th scope="col" data-i18n="p1.generate.job"></th>
              </tr>
            </thead>
            <tbody id="history-rows"></tbody>
          </table>
        </div>

        <div class="card history-card">
          <div class="section-head">
            <h3 data-i18n="p1.history.dictionary"></h3>
            <button id="job-dict-load" type="button" class="btn btn-ghost" data-i18n="p1.history.load_dictionary"></button>
          </div>
          <p id="selected-job" class="meta" data-i18n="p1.history.none"></p>
          <div class="table-wrap">
            <table class="review-table">
              <thead>
                <tr>
                  <th scope="col" data-i18n="p1.review.token"></th>
                  <th scope="col" data-i18n="p1.history.real_value"></th>
                </tr>
              </thead>
              <tbody id="job-dict-rows"></tbody>
            </table>
          </div>
          <p id="job-dict-note" class="note" hidden></p>
        </div>

        <div class="field">
          <label for="restore-passphrase" data-i18n="p1.restore.passphrase"></label>
          <input id="restore-passphrase" type="password" autocomplete="off" />
        </div>
        <div id="restore-drop" class="dropzone" tabindex="0" role="button">
          <p data-i18n="p1.restore.file"></p>
        </div>
        <input id="restore-input" type="file" accept=".docx,.xlsx,.pptx" hidden />
        <p id="restore-file" class="file-line" hidden></p>
        <div class="actions">
          <button id="restore-btn" type="button" class="btn btn-primary" disabled data-i18n="p1.restore.run"></button>
        </div>
        <div id="restore-result" class="card" hidden>
          <p id="restore-summary" class="result-line"></p>
          <button id="restore-download" type="button" class="btn btn-primary" data-i18n="p1.restore.download"></button>
        </div>
      </section>

      <section id="panel-dictionary" class="panel" role="tabpanel"
               aria-labelledby="tab-dictionary" hidden>
        <h2 data-i18n="p1.dictionary.title"></h2>
        <p class="hint" data-i18n="p1.dictionary.hint"></p>
        <div class="dictionary-tools">
          <input id="dict-search" type="search" data-i18n-placeholder="p1.dictionary.search" />
          <span id="dict-count" class="meta"></span>
          <button id="dict-refresh" type="button" class="btn btn-ghost" data-i18n="p1.dictionary.refresh"></button>
        </div>
        <div class="manual-row">
          <label for="dict-name" data-i18n="p1.dictionary.term"></label>
          <input id="dict-name" type="text" />
          <select id="dict-type" aria-label="Type"></select>
          <button id="dict-add" type="button" class="btn btn-primary" data-i18n="p1.manual.add"></button>
        </div>
        <div class="table-wrap">
          <table class="review-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="p1.dictionary.enabled"></th>
                <th scope="col" data-i18n="p1.review.value"></th>
                <th scope="col" data-i18n="p1.review.type"></th>
                <th scope="col" data-i18n="p1.dictionary.source"></th>
                <th scope="col" data-i18n="p1.dictionary.aliases"></th>
              </tr>
            </thead>
            <tbody id="dict-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span data-i18n="p1.privacy"></span>
      <span id="storage-line" class="meta"></span>
    </footer>

    <div id="progress" class="progress" hidden>
      <progress id="progress-bar" max="100"></progress>
      <span id="progress-label"></span>
      <button id="cancel-btn" type="button" class="btn btn-ghost" data-i18n="p1.cancel"></button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./client-store.js"></script>
    <script type="module" src="./ui/app.js"></script>
  </body>
</html>
